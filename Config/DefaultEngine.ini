; VSync off presents with ALLOW_TEARING. A focused
; shipping window then jitters, and the Steam
; overlay cannot hook that Present. Sandboxie does
; not take the tearing path. SystemSettings blocks
; a saved GameUserSettings value from clearing it.
[SystemSettings]
r.VSync=1
r.D3D12.UseAllowTearing=0
r.D3D11.UseAllowTearing=0

